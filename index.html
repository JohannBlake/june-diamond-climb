<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Rift Coop</title>
<style>
:root{--bg:#05010f;--fg:#e8f6ff;--p1:#22e0ff;--p2:#ffb020;--acc:#ff2bd6}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 0 8px #000}
#mission{position:absolute;top:14px;left:50%;transform:translateX(-50%);text-align:center;font-size:18px;letter-spacing:.08em;text-transform:uppercase}
#mission b{display:block;font-size:13px;color:var(--acc);letter-spacing:.3em}
#prog{font-size:15px;opacity:.9;margin-top:4px;text-transform:none;letter-spacing:0}
.hp{position:absolute;bottom:16px;width:min(34vw,260px)}
.hp span{font-size:12px;letter-spacing:.2em}
.bar{height:10px;border:1px solid currentColor;border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:currentColor;box-shadow:0 0 12px currentColor;width:100%}
#h1{left:16px;color:var(--p1)}#h2{right:16px;color:var(--p2);text-align:right}
#bossbar{position:absolute;top:84px;left:50%;transform:translateX(-50%);width:min(60vw,480px);color:#ff4060;display:none}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#1a0638cc,#05010fee);text-align:center;padding:16px}
#ov h1{font-size:clamp(36px,8vw,84px);margin:0;letter-spacing:.1em;background:linear-gradient(90deg,var(--p1),var(--acc),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
#ov p{line-height:1.7;max-width:560px;margin:14px auto}
kbd{border:1px solid #fff6;border-radius:4px;padding:1px 6px;font-family:inherit}
button{font:inherit;font-size:18px;padding:12px 34px;border-radius:30px;border:2px solid var(--acc);background:#ff2bd622;color:var(--fg);cursor:pointer;letter-spacing:.15em;box-shadow:0 0 24px #ff2bd688}
#flash{position:fixed;top:40%;left:0;right:0;text-align:center;font-size:clamp(24px,5vw,48px);letter-spacing:.2em;opacity:0;transition:opacity .4s;pointer-events:none;text-shadow:0 0 20px var(--acc)}
</style>
</head>
<body>
<div id="hud">
  <div id="mission"><b id="mnum"></b><span id="mtxt"></span><div id="prog"></div></div>
  <div id="bossbar"><div class="bar"><i id="bhp"></i></div></div>
  <div class="hp" id="h1"><span>PILOT 1</span><div class="bar"><i id="hp1"></i></div></div>
  <div class="hp" id="h2"><span>PILOT 2</span><div class="bar"><i id="hp2"></i></div></div>
</div>
<div id="flash"></div>
<div id="ov"><div>
  <h1>NEON RIFT</h1>
  <p id="ovtxt">Koop für zwei an einer Tastatur – drei Missionen.<br>
  <span style="color:var(--p1)">Pilot 1:</span> <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> fliegen, <kbd>Leertaste</kbd> feuern<br>
  <span style="color:var(--p2)">Pilot 2:</span> <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> fliegen, <kbd>Enter</kbd> feuern<br>
  Fällt ein Pilot aus, kehrt er nach 5 s zurück – solange der Partner überlebt.</p>
  <button id="go">START</button>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.25;document.body.prepend(R.domElement);
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(55,1,.1,2000);
function rs(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()}addEventListener('resize',rs);rs();
// sky
(function(){const c=document.createElement('canvas');c.width=4;c.height=256;const g=c.getContext('2d'),gr=g.createLinearGradient(0,0,0,256);
gr.addColorStop(0,'#02000a');gr.addColorStop(.45,'#1a0540');gr.addColorStop(.7,'#7a1470');gr.addColorStop(1,'#ff5a3c');g.fillStyle=gr;g.fillRect(0,0,4,256);
S.background=new THREE.CanvasTexture(c)})();
S.fog=new THREE.FogExp2(0x3a0a55,.0065);
const gt=(function(){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),gr=g.createRadialGradient(64,64,0,64,64,64);
gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.25,'rgba(255,255,255,.55)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)})();
const mats={};
function gm(col,fog){const k=col+'_'+fog;return mats[k]||(mats[k]=new THREE.SpriteMaterial({map:gt,color:col,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,fog:fog!==false}))}
function glow(col,s,fog){const sp=new THREE.Sprite(gm(col,fog));sp.scale.set(s,s,1);return sp}
// sun + stars
const sun=glow(0xff7a3c,420,false);sun.position.set(0,70,-600);S.add(sun);
const sun2=glow(0xffe0a0,170,false);sun2.position.copy(sun.position);S.add(sun2);
(function(){const n=1800,p=new Float32Array(n*3);for(let i=0;i<n;i++){const a=Math.random()*6.283,e=Math.random()*1.3+.12,r=900;
p[i*3]=Math.cos(a)*Math.cos(e)*r;p[i*3+1]=Math.sin(e)*r;p[i*3+2]=Math.sin(a)*Math.cos(e)*r}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));
S.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:2.2,sizeAttenuation:false,fog:false,transparent:true,opacity:.9})))})();
// terrain
const AR=85;
(function(){const g=new THREE.PlaneGeometry(900,900,150,150);g.rotateX(-Math.PI/2);const p=g.attributes.position;
for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i),d=Math.hypot(x,z),k=Math.max(0,d-AR-12);
p.setY(i,k*.42*(1.4+Math.sin(x*.045)+Math.cos(z*.06)+.6*Math.sin((x+z)*.11))+ (d<AR+12?Math.sin(x*.2)*Math.cos(z*.2)*.25:0))}
g.computeVertexNormals();
S.add(new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0x0b0326,roughness:.35,metalness:.8,flatShading:true})));
const w=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0xff2bd6,wireframe:true,transparent:true,opacity:.42,blending:THREE.AdditiveBlending,depthWrite:false}));w.position.y=.06;S.add(w)})();
S.add(new THREE.HemisphereLight(0x8a5cff,0x200030,.7));
const dl=new THREE.DirectionalLight(0xff8a5c,1.3);dl.position.set(0,40,-100);S.add(dl);
// monoliths
const monos=[];for(let i=0;i<14;i++){const a=i/14*6.283,h=14+Math.random()*26,col=i%2?0x22e0ff:0xff2bd6;
const m=new THREE.Mesh(new THREE.BoxGeometry(3,h,3),new THREE.MeshStandardMaterial({color:0x080818,emissive:col,emissiveIntensity:.9,metalness:.9,roughness:.2}));
m.position.set(Math.cos(a)*(AR+6),h/2,Math.sin(a)*(AR+6));S.add(m);const gl=glow(col,22);gl.position.set(m.position.x,h+2,m.position.z);S.add(gl);monos.push(gl)}
// particles
const parts=[];function burst(pos,col,n,sp,sz){for(let i=0;i<n;i++){const s=glow(col,sz||2);s.position.copy(pos);
const a=Math.random()*6.283,b=(Math.random()-.3)*2;s.userData={v:new THREE.Vector3(Math.cos(a)*sp*Math.random(),b*sp*.5,Math.sin(a)*sp*Math.random()),l:.5+Math.random()*.6,s:sz||2};S.add(s);parts.push(s)}}
// players
function mkShip(col){const g=new THREE.Group(),m=new THREE.MeshStandardMaterial({color:0x101828,emissive:col,emissiveIntensity:.55,metalness:.9,roughness:.25,flatShading:true});
const b=new THREE.Mesh(new THREE.ConeGeometry(.9,4,6),m);b.rotation.x=-Math.PI/2;g.add(b);
const w=new THREE.Mesh(new THREE.BoxGeometry(5,.15,1.3),m);w.position.z=.9;g.add(w);
const f=new THREE.Mesh(new THREE.BoxGeometry(.15,1.2,1.2),m);f.position.set(0,.6,1.3);g.add(f);
const e=glow(col,5);e.position.z=2.2;g.add(e);const l=new THREE.PointLight(col,2.2,45);l.position.y=2;g.add(l);
const ring=new THREE.Mesh(new THREE.RingGeometry(2.6,3,32),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.5,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}));
ring.rotation.x=-Math.PI/2;ring.position.y=-2.6;g.add(ring);S.add(g);return g}
const P=[{col:0x22e0ff,k:['KeyW','KeyS','KeyA','KeyD','Space'],x:-8},{col:0xffb020,k:['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'],x:8}];
P.forEach(p=>{p.m=mkShip(p.col);p.v=new THREE.Vector3();p.hp=100;p.cd=0;p.dead=0;p.ang=0;p.m.position.set(p.x,3,10)});
const K={};addEventListener('keydown',e=>{K[e.code]=1;if(/Arrow|Space/.test(e.code))e.preventDefault()});addEventListener('keyup',e=>K[e.code]=0);
// entities
let bullets=[],ebul=[],enemies=[],crystals=[],boss=null,mission=-1,count=0,running=false,spawnT=0,T=0,shake=0;
const bg=new THREE.SphereGeometry(.35,8,8),eg=new THREE.OctahedronGeometry(1.6),cg=new THREE.OctahedronGeometry(1.4);
function rnd(r){const a=Math.random()*6.283,d=Math.sqrt(Math.random())*r;return new THREE.Vector3(Math.cos(a)*d,3,Math.sin(a)*d)}
function mkEnemy(){const m=new THREE.Mesh(eg,new THREE.MeshStandardMaterial({color:0x200008,emissive:0xff2040,emissiveIntensity:1.2,flatShading:true,metalness:.8,roughness:.3}));
const a=Math.random()*6.283;m.position.set(Math.cos(a)*AR,3,Math.sin(a)*AR);m.add(glow(0xff2040,7));m.userData.hp=2;S.add(m);enemies.push(m)}
function mkCrystal(){const m=new THREE.Mesh(cg,new THREE.MeshStandardMaterial({color:0x66ffcc,emissive:0x22ffaa,emissiveIntensity:1.4,flatShading:true,transparent:true,opacity:.9}));
m.position.copy(rnd(AR-10));m.add(glow(0x22ffaa,9));const beam=new THREE.Mesh(new THREE.CylinderGeometry(.15,.15,60,6),new THREE.MeshBasicMaterial({color:0x22ffaa,transparent:true,opacity:.35,blending:THREE.AdditiveBlending,depthWrite:false}));beam.position.y=30;m.add(beam);S.add(m);crystals.push(m)}
function mkBoss(){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(7,0),new THREE.MeshStandardMaterial({color:0x100010,emissive:0xff2060,emissiveIntensity:.9,flatShading:true,metalness:1,roughness:.15}));
m.position.set(0,9,-30);m.add(glow(0xff2060,40));const l=new THREE.PointLight(0xff2060,3,120);m.add(l);
const r=new THREE.Mesh(new THREE.TorusGeometry(11,.35,8,48),new THREE.MeshBasicMaterial({color:0xff60a0}));m.add(r);m.userData={hp:70,max:70,cd:2,ring:r};S.add(m);boss=m}
function shot(arr,pos,dir,col,sp){const m=new THREE.Mesh(bg,new THREE.MeshBasicMaterial({color:col}));m.position.copy(pos);m.add(glow(col,3.5));m.userData={v:dir.clone().multiplyScalar(sp),l:2.2};S.add(m);arr.push(m)}
function clear(a){a.forEach(o=>S.remove(o));a.length=0}
const $=id=>document.getElementById(id);
function flash(t){const f=$('flash');f.textContent=t;f.style.opacity=1;setTimeout(()=>f.style.opacity=0,1800)}
const M=[{t:'Sammelt 8 Energiekristalle',n:8},{t:'Zerstört 15 Drohnen',n:15},{t:'Vernichtet den Kern-Wächter',n:1}];
function startMission(i){mission=i;count=0;clear(enemies);clear(crystals);clear(ebul);clear(bullets);if(boss){S.remove(boss);boss=null}
P.forEach(p=>{p.hp=100;p.dead=0;p.m.visible=true;p.m.position.set(p.x,3,10);p.v.set(0,0,0)});
$('bossbar').style.display=i==2?'block':'none';
if(i==0)for(let k=0;k<4;k++)mkCrystal();if(i==2)mkBoss();
$('mnum').textContent='MISSION '+(i+1)+' / 3';$('mtxt').textContent=M[i].t;flash('MISSION '+(i+1));spawnT=2}
function end(win){running=false;$('ov').style.display='flex';$('ovtxt').innerHTML=win?'Alle Missionen erfüllt. Der Rift ist gesichert!':'Beide Piloten ausgefallen.';$('go').textContent=win?'NOCHMAL':'ERNEUT VERSUCHEN';$('go').onclick=()=>{$('ov').style.display='none';running=true;startMission(win?0:mission)}}
$('go').onclick=()=>{$('ov').style.display='none';running=true;startMission(0)};
function hurt(p,d){if(p.dead)return;p.hp-=d;shake=.4;burst(p.m.position,p.col,6,14);if(p.hp<=0){p.hp=0;p.dead=5;p.m.visible=false;burst(p.m.position,p.col,40,30,3);
if(P.every(q=>q.dead))setTimeout(()=>end(false),900)}}
function kill(e,i){burst(e.position,0xff5030,22,26,2.5);burst(e.position,0xffe080,8,12,1.5);S.remove(e);enemies.splice(i,1);shake=.25;if(mission==1)count++}
const tmp=new THREE.Vector3(),cam=new THREE.Vector3(0,30,40),look=new THREE.Vector3();
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
if(running){
P.forEach(p=>{if(p.dead){if(!P.every(q=>q.dead)){p.dead-=dt;if(p.dead<=0){p.dead=0;p.hp=60;p.m.visible=true;const o=P.find(q=>q!==p);p.m.position.copy(o.m.position).x+=5;burst(p.m.position,p.col,20,15)}}return}
const ax=(K[p.k[3]]?1:0)-(K[p.k[2]]?1:0),az=(K[p.k[1]]?1:0)-(K[p.k[0]]?1:0);
p.v.x+=ax*95*dt;p.v.z+=az*95*dt;p.v.multiplyScalar(Math.pow(.06,dt));p.m.position.addScaledVector(p.v,dt);
const d=Math.hypot(p.m.position.x,p.m.position.z);if(d>AR-3){p.m.position.x*=(AR-3)/d;p.m.position.z*=(AR-3)/d}
if(ax||az)p.ang=Math.atan2(-ax,-az);let da=p.ang-p.m.rotation.y;da=Math.atan2(Math.sin(da),Math.cos(da));p.m.rotation.y+=da*Math.min(1,dt*10);
p.m.rotation.z=THREE.MathUtils.lerp(p.m.rotation.z,-ax*.5,dt*6);p.m.position.y=3+Math.sin(T*3+p.x)*.3;
if(Math.random()<.5){const s=glow(p.col,1.6);s.position.copy(p.m.position);s.userData={v:new THREE.Vector3((Math.random()-.5)*2,0,(Math.random()-.5)*2),l:.35,s:1.6};S.add(s);parts.push(s)}
p.cd-=dt;if(K[p.k[4]]&&p.cd<=0){p.cd=.16;const dir=new THREE.Vector3(-Math.sin(p.m.rotation.y),0,-Math.cos(p.m.rotation.y));
let best=null,bd=55;enemies.concat(boss?[boss]:[]).forEach(e=>{tmp.copy(e.position).sub(p.m.position);tmp.y=0;const l=tmp.length();if(l<bd&&tmp.normalize().dot(dir)>.8){bd=l;best=tmp.clone()}});
shot(bullets,p.m.position,best||dir,p.col,90)}});
// enemy spawn
spawnT-=dt;const cap=mission==0?5:mission==1?9:5;if(spawnT<=0&&enemies.length<cap){mkEnemy();spawnT=mission==1?.8:2.2}
enemies.forEach(e=>{let t=null,bd=1e9;P.forEach(p=>{if(!p.dead){const d=p.m.position.distanceTo(e.position);if(d<bd){bd=d;t=p}}});
if(t){tmp.copy(t.m.position).sub(e.position);tmp.y=0;tmp.normalize();e.position.addScaledVector(tmp,(13+mission*3)*dt);if(bd<2.6){hurt(t,12);e.position.addScaledVector(tmp,-8)}}
e.rotation.x+=dt*2;e.rotation.y+=dt*3;e.position.y=3+Math.sin(T*4+e.id)*.5});
for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.position.addScaledVector(b.userData.v,dt);b.userData.l-=dt;let hit=b.userData.l<=0;
for(let j=enemies.length-1;j>=0&&!hit;j--){const e=enemies[j];if(Math.hypot(e.position.x-b.position.x,e.position.z-b.position.z)<2.4){hit=true;burst(b.position,0xffffff,3,8,1);if(--e.userData.hp<=0)kill(e,j)}}
if(!hit&&boss&&Math.hypot(boss.position.x-b.position.x,boss.position.z-b.position.z)<8){hit=true;boss.userData.hp--;burst(b.position,0xff80a0,4,14,1.5);
if(boss.userData.hp<=0){for(let k=0;k<6;k++){tmp.copy(boss.position).add(rnd(8));burst(tmp,k%2?0xff2060:0xffe080,40,45,4)}S.remove(boss);boss=null;shake=1.2;count=1}}
if(hit){S.remove(b);bullets.splice(i,1)}}
if(boss){const u=boss.userData;boss.rotation.y+=dt*.6;boss.rotation.x+=dt*.3;u.ring.rotation.x+=dt*2;boss.position.x=Math.sin(T*.5)*35;boss.position.z=Math.cos(T*.35)*30-10;
u.cd-=dt;if(u.cd<=0){const hard=u.hp<u.max/2;u.cd=hard?1.1:1.7;const n=hard?16:11,o=Math.random()*6;for(let k=0;k<n;k++){const a=o+k/n*6.283;tmp.set(boss.position.x,3,boss.position.z);shot(ebul,tmp,new THREE.Vector3(Math.cos(a),0,Math.sin(a)),0xff3070,24)}ebul.forEach(b=>b.userData.l=Math.max(b.userData.l,0));}
$('bhp').style.width=u.hp/u.max*100+'%';
P.forEach(p=>{if(!p.dead&&Math.hypot(p.m.position.x-boss.position.x,p.m.position.z-boss.position.z)<9){hurt(p,20);tmp.copy(p.m.position).sub(boss.position);tmp.y=0;p.v.addScaledVector(tmp.normalize(),60)}})}
for(let i=ebul.length-1;i>=0;i--){const b=ebul[i];b.position.addScaledVector(b.userData.v,dt);b.userData.l-=dt*.35;let hit=b.userData.l<=0;
P.forEach(p=>{if(!hit&&!p.dead&&p.m.position.distanceTo(b.position)<2.2){hit=true;hurt(p,10)}});if(hit){S.remove(b);ebul.splice(i,1)}}
for(let i=crystals.length-1;i>=0;i--){const c=crystals[i];c.rotation.y+=dt*2;c.position.y=3.5+Math.sin(T*2+i)*.6;
if(P.some(p=>!p.dead&&Math.hypot(p.m.position.x-c.position.x,p.m.position.z-c.position.z)<3.5)){burst(c.position,0x22ffaa,30,22,2.5);S.remove(c);crystals.splice(i,1);count++;if(count+crystals.length<M[0].n)mkCrystal()}}
if(mission>=0&&count>=M[mission].n){if(mission<2){flash('MISSION ERFÜLLT');startMission(mission+1)}else{mission=-1;setTimeout(()=>end(true),1800)}}
if(mission>=0)$('prog').textContent=mission==2?'':count+' / '+M[mission].n;
$('hp1').style.width=P[0].hp+'%';$('hp2').style.width=P[1].hp+'%';
}
for(let i=parts.length-1;i>=0;i--){const s=parts[i],u=s.userData;u.l-=dt;s.position.addScaledVector(u.v,dt);u.v.multiplyScalar(1-dt*2);const k=Math.max(0,u.l)*u.s*1.6+.01;s.scale.set(k,k,1);if(u.l<=0){S.remove(s);parts.splice(i,1)}}
monos.forEach((g,i)=>{const k=20+Math.sin(T*2+i)*6;g.scale.set(k,k,1)});
// camera
const al=P.filter(p=>!p.dead),a=al[0]||P[0],b=al[1]||a;look.copy(a.m.position).add(b.m.position).multiplyScalar(.5);
const sep=a.m.position.distanceTo(b.m.position);tmp.set(look.x*.8,24+sep*.32,look.z+30+sep*.36);
if(!running){tmp.set(Math.sin(T*.15)*70,26,Math.cos(T*.15)*70);look.set(0,4,0)}
cam.lerp(tmp,Math.min(1,dt*3));C.position.copy(cam);if(shake>0){shake-=dt;C.position.x+=(Math.random()-.5)*shake*2;C.position.y+=(Math.random()-.5)*shake*2}
C.lookAt(look.x,2,look.z-4);R.render(S,C)}
requestAnimationFrame(loop);
</script>
</body>
</html>
