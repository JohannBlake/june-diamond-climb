<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Tether</title>
<style>
:root{--bg:#04050d;--fg:#e8f4ff}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;font-family:system-ui,sans-serif}
canvas{display:block;width:100vw;height:100vh;outline:none}
</style></head><body><canvas id="c" tabindex="0"></canvas>
<script>
const C=document.getElementById('c'),g=C.getContext('2d');let W=0,H=0,DPR=1;
const R=Math.random,TAU=Math.PI*2,rnd=(a,b)=>a+R()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let st='menu',lvl=1,score=0,combo=1,comboT=0,hi=0,T=0,shake=0,mis=null,ens=[],bul=[],ebul=[],parts=[],gems=[],crys=[],txts=[],core=null,spawnT=0,msg='',msgT=0,cards=[],sel=1,stT=0,flash=0,hue=200,bg=null,stars=[];
try{hi=+localStorage.getItem('neonTetherHi')||0}catch(e){}
let up;const K={};
function mkP(i){return{i,x:0,y:0,vx:0,vy:0,a:-Math.PI/2,hp:100,cd:0,down:false,rev:0,inv:0,col:i?'#ff4fd8':'#3df2ff'}}
let P=[mkP(0),mkP(1)];
const UPS=[
['Plasma-Kern','+25% Schaden',()=>up.dmg*=1.25],['Schnellfeuer','+20% Feuerrate',()=>up.rate*=1.2],
['Nachbrenner','+12% Tempo',()=>up.spd*=1.12],['Hyper-Strahl','+40% Strahl-Schaden',()=>up.tether*=1.4],
['Langes Band','+25% Strahl-Reichweite',()=>up.range*=1.25],['Panzerung','+30 Max-HP & volle Heilung',()=>{up.hpmax+=30;P.forEach(p=>p.hp=up.hpmax)}],
['Nanobots','+2 HP/s Regeneration',()=>up.regen+=2],['Magnetfeld','+60% Sammelradius',()=>up.magnet*=1.6],
['Zwillingslauf','+1 Projektil pro Schuss',()=>up.multi++],['Durchschlag','Projektile durchdringen +1 Gegner',()=>up.pierce++]];
const SECT=['Cyan-Nebel','Magma-Riff','Smaragd-Leere','Violett-Sturm','Gold-Korona','Eis-Abgrund'];

// ---------- audio
let AC;function snd(f,d=.08,ty='square',v=.04,sl=0){if(!AC)return;try{const o=AC.createOscillator(),ga=AC.createGain(),n=AC.currentTime;o.type=ty;o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),n+d);ga.gain.setValueAtTime(v,n);ga.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(ga);ga.connect(AC.destination);o.start();o.stop(n+d)}catch(e){}}

// ---------- setup
function rs(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;C.width=W*DPR;C.height=H*DPR;mkBg();stars=[];for(let i=0;i<220;i++)stars.push({x:R()*W,y:R()*H,z:rnd(.2,1),tw:R()*TAU})}
function mkBg(){bg=document.createElement('canvas');bg.width=W+160;bg.height=H+160;const q=bg.getContext('2d');
 const lg=q.createLinearGradient(0,0,0,bg.height);lg.addColorStop(0,`hsl(${hue+30},60%,5%)`);lg.addColorStop(1,`hsl(${hue-20},70%,3%)`);q.fillStyle=lg;q.fillRect(0,0,bg.width,bg.height);
 q.globalCompositeOperation='lighter';
 for(let i=0;i<26;i++){const x=R()*bg.width,y=R()*bg.height,r=rnd(120,420),h=hue+rnd(-45,45),gr=q.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`hsla(${h},90%,50%,${rnd(.04,.13)})`);gr.addColorStop(1,'transparent');q.fillStyle=gr;q.fillRect(x-r,y-r,r*2,r*2)}
 for(let i=0;i<900;i++){q.fillStyle=`hsla(${hue+rnd(-60,60)},80%,80%,${rnd(.05,.5)})`;q.fillRect(R()*bg.width,R()*bg.height,R()<.9?1:2,1)}
 // distant planet
 const px=rnd(.15,.85)*bg.width,py=rnd(.15,.6)*bg.height,pr=rnd(60,130);q.globalCompositeOperation='source-over';
 let pg=q.createRadialGradient(px-pr*.4,py-pr*.4,pr*.1,px,py,pr);pg.addColorStop(0,`hsl(${hue+40},60%,45%)`);pg.addColorStop(.7,`hsl(${hue+10},60%,14%)`);pg.addColorStop(1,`hsl(${hue},60%,4%)`);q.fillStyle=pg;q.beginPath();q.arc(px,py,pr,0,TAU);q.fill();
 q.strokeStyle=`hsla(${hue+60},90%,70%,.35)`;q.lineWidth=3;q.beginPath();q.ellipse(px,py,pr*1.7,pr*.35,-.4,0,TAU);q.stroke();
 q.globalCompositeOperation='lighter';pg=q.createRadialGradient(px,py,pr*.9,px,py,pr*1.5);pg.addColorStop(0,`hsla(${hue+40},90%,60%,.25)`);pg.addColorStop(1,'transparent');q.fillStyle=pg;q.fillRect(px-pr*2,py-pr*2,pr*4,pr*4)}
function newGame(){up={dmg:1,rate:1,spd:1,tether:1,range:1,hpmax:100,regen:0,magnet:1,multi:1,pierce:0};lvl=1;score=0;combo=1;P=[mkP(0),mkP(1)];startLevel()}
function mkMission(l){const k=(l-1)%5,s=Math.floor((l-1)/5);
 return[{type:'kill',need:18+l*4,txt:'Vernichtet die Schwarm-Drohnen'},{type:'collect',need:8+s*3,txt:'Bergt die Energiekristalle'},{type:'defend',need:35+s*10,txt:'Verteidigt den Reaktor'},{type:'tether',need:10+s*5,txt:'Zerschneidet Gegner mit dem Strahl'},{type:'boss',need:1,txt:'Zerstört den Sektor-Wächter'}][k]}
function startLevel(){ens=[];bul=[];ebul=[];gems=[];crys=[];core=null;spawnT=1.5;mis=mkMission(lvl);mis.prog=0;
 const s=Math.floor((lvl-1)/5);hue=(190+s*67+((lvl-1)%5)*9)%360;mkBg();
 P.forEach((p,i)=>{p.x=W/2+(i?90:-90);p.y=H/2+80;p.vx=p.vy=0;p.down=false;p.rev=0;p.inv=1.5;p.hp=Math.min(up.hpmax,Math.max(p.hp,0)+up.hpmax*.4)});
 if(mis.type=='defend')core={x:W/2,y:H/2,hp:300,max:300};
 if(mis.type=='boss')spawn('boss');
 msg='LEVEL '+lvl+' · '+mis.txt;msgT=3.2;st='play';stT=0;snd(220,.4,'sawtooth',.05,400)}
function spawn(type){const l=lvl,sc=1+l*.17;let x,y;const s=R()*4|0;if(s==0){x=-30;y=R()*H}else if(s==1){x=W+30;y=R()*H}else if(s==2){x=R()*W;y=-30}else{x=R()*W;y=H+30}
 if(!type){const r=R();type=l>=4&&r<.16?'shooter':l>=3&&r<.32?'tank':l>=2&&r<.55?'dasher':'drone'}
 const D={drone:[22,13,95,'#ff5a3d'],dasher:[14,10,175,'#ffd23d'],tank:[90,22,55,'#9d6bff'],shooter:[30,14,70,'#4dff9a'],boss:[1400,56,45,'#ff3d6e']}[type];
 const e={type,x,y,vx:0,vy:0,hp:D[0]*sc*(type=='boss'?1+Math.floor((l-1)/5)*.8:1),r:D[1],spd:D[2]*(1+l*.015),col:D[3],cd:rnd(1,2.5),cd2:4,hit:0,a:R()*TAU,tc:core&&R()<.65,byT:0};e.max=e.hp;
 if(type=='boss'){e.x=W/2;e.y=-80}ens.push(e)}

// ---------- fx
function boom(x,y,col,n=14,sp=220){for(let i=0;i<n&&parts.length<700;i++){const a=R()*TAU,v=rnd(.2,1)*sp;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rnd(.3,.8),ml:.8,col,r:rnd(2,7)})}}
function hurt(p,d){if(p.inv>0||p.down)return;p.hp-=d*(1+lvl*.05);p.inv=.45;shake=10;combo=1;flash=.25;boom(p.x,p.y,p.col,10);snd(120,.2,'sawtooth',.07,-60);
 if(p.hp<=0){p.hp=0;p.down=true;p.rev=0;boom(p.x,p.y,p.col,40,340);msg='PILOT '+(p.i+1)+' AM BODEN – ZUM RETTEN HINFLIEGEN!';msgT=2.5;if(P.every(q=>q.down))over()}}
function over(){st='over';stT=0;if(score>hi){hi=Math.floor(score);try{localStorage.setItem('neonTetherHi',hi)}catch(e){}}snd(200,1,'sawtooth',.08,-170)}
function kill(e){boom(e.x,e.y,e.col,e.type=='boss'?120:18,e.type=='boss'?520:240);shake=Math.max(shake,e.type=='boss'?30:5);
 const pts=({drone:10,dasher:15,tank:40,shooter:30,boss:1000})[e.type]*combo;score+=pts;combo=Math.min(20,combo+.1);comboT=3.5;
 txts.push({x:e.x,y:e.y,s:'+'+Math.round(pts),l:.9,col:e.col});
 const n=e.type=='boss'?30:e.type=='tank'?3:1;for(let i=0;i<n;i++)gems.push({x:e.x+rnd(-12,12),y:e.y+rnd(-12,12),vx:rnd(-90,90),vy:rnd(-90,90),l:9});
 snd(rnd(300,420),.12,'triangle',.05,-200);
 if(mis.type=='kill')mis.prog++;if(mis.type=='tether'&&e.byT>0)mis.prog++;if(mis.type=='boss'&&e.type=='boss')mis.prog=1}
function segD(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy||1,u=clamp(((px-ax)*dx+(py-ay)*dy)/l,0,1);return Math.hypot(px-ax-dx*u,py-ay-dy*u)}
function tetherOn(){return !P[0].down&&!P[1].down&&Math.hypot(P[0].x-P[1].x,P[0].y-P[1].y)<420*up.range}

// ---------- update
function update(dt){T+=dt;stT+=dt;shake*=Math.pow(.002,dt);flash=Math.max(0,flash-dt);msgT-=dt;
 for(let i=parts.length;i--;){const p=parts[i];p.l-=dt;if(p.l<=0){parts.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96}
 for(let i=txts.length;i--;){const t=txts[i];t.l-=dt;t.y-=40*dt;if(t.l<=0)txts.splice(i,1)}
 if(st!='play')return;
 comboT-=dt;if(comboT<=0&&combo>1)combo=Math.max(1,combo-dt*1.5);
 // players
 const keys=[['KeyW','KeyS','KeyA','KeyD'],['ArrowUp','ArrowDown','ArrowLeft','ArrowRight']];
 P.forEach((p,i)=>{const o=P[1-i];p.inv-=dt;
  if(p.down){if(!o.down&&Math.hypot(o.x-p.x,o.y-p.y)<75){p.rev+=dt;if(p.rev>2.2){p.down=false;p.hp=up.hpmax*.5;p.inv=2;boom(p.x,p.y,'#ffffff',30);snd(520,.4,'triangle',.07,500);msg='WIEDERBELEBT!';msgT=1.5}}else p.rev=Math.max(0,p.rev-dt);return}
  const k=keys[i];let ax=(K[k[3]]?1:0)-(K[k[2]]?1:0),ay=(K[k[1]]?1:0)-(K[k[0]]?1:0);const m=Math.hypot(ax,ay)||1;
  p.vx+=ax/m*2300*dt;p.vy+=ay/m*2300*dt;const f=Math.pow(.0025,dt);p.vx*=f;p.vy*=f;const ms=330*up.spd,v=Math.hypot(p.vx,p.vy);if(v>ms){p.vx*=ms/v;p.vy*=ms/v}
  p.x=clamp(p.x+p.vx*dt,18,W-18);p.y=clamp(p.y+p.vy*dt,18,H-18);p.hp=Math.min(up.hpmax,p.hp+up.regen*dt);
  if(v>60&&parts.length<700)parts.push({x:p.x-Math.cos(p.a)*12,y:p.y-Math.sin(p.a)*12,vx:-p.vx*.3+rnd(-30,30),vy:-p.vy*.3+rnd(-30,30),l:.35,ml:.35,col:p.col,r:4});
  // auto-fire
  let best=null,bd=560;for(const e of ens){const d=Math.hypot(e.x-p.x,e.y-p.y);if(d<bd){bd=d;best=e}}
  let ta=best?Math.atan2(best.y-p.y,best.x-p.x):v>40?Math.atan2(p.vy,p.vx):p.a;let da=((ta-p.a+Math.PI*3)%TAU)-Math.PI;p.a+=da*Math.min(1,dt*14);
  p.cd-=dt;if(best&&p.cd<=0){p.cd=.26/up.rate;for(let j=0;j<up.multi;j++){const a=ta+(j-(up.multi-1)/2)*.13;bul.push({x:p.x+Math.cos(a)*16,y:p.y+Math.sin(a)*16,vx:Math.cos(a)*760,vy:Math.sin(a)*760,l:.85,d:9*up.dmg,pc:up.pierce,col:p.col})}snd(i?640:780,.05,'square',.012,-300)}});
 // spawn
 spawnT-=dt;const cap=mis.type=='boss'?10:22+lvl*2;if(spawnT<=0&&ens.length<cap){spawn();if(lvl>3&&R()<.4)spawn();spawnT=Math.max(.22,(mis.type=='boss'?1.6:1.05)-lvl*.045)}
 if(mis.type=='collect'&&crys.length<3)crys.push({x:rnd(80,W-80),y:rnd(110,H-80),a:R()*TAU});
 if(mis.type=='defend')mis.prog=Math.min(mis.need,mis.prog+dt);
 // tether
 const ton=tetherOn(),A=P[0],B=P[1];
 // enemies
 for(let i=ens.length;i--;){const e=ens[i];e.hit-=dt;e.byT-=dt;e.a+=dt*(e.type=='boss'?.5:2);
  let tx,ty,td=1e9;if(e.tc&&core){tx=core.x;ty=core.y;td=Math.hypot(tx-e.x,ty-e.y)}else for(const p of P)if(!p.down){const d=Math.hypot(p.x-e.x,p.y-e.y);if(d<td){td=d;tx=p.x;ty=p.y}}
  if(tx==null){tx=W/2;ty=H/2;td=Math.hypot(tx-e.x,ty-e.y)}
  let dx=(tx-e.x)/(td||1),dy=(ty-e.y)/(td||1);
  if(e.type=='shooter'){if(td<250){const t=dx;dx=-dy;dy=t}e.cd-=dt;if(e.cd<=0&&td<520){e.cd=2;const a=Math.atan2(ty-e.y,tx-e.x);ebul.push({x:e.x,y:e.y,vx:Math.cos(a)*230,vy:Math.sin(a)*230,l:4});snd(180,.1,'sine',.03)}}
  if(e.type=='boss'){const ox=W/2+Math.cos(T*.4)*W*.28,oy=H/2+Math.sin(T*.55)*H*.25,d=Math.hypot(ox-e.x,oy-e.y)||1;dx=(ox-e.x)/d;dy=(oy-e.y)/d;
   e.cd-=dt;if(e.cd<=0){e.cd=e.hp<e.max*.4?1.3:2.1;const n=14+Math.floor(lvl/5)*2;for(let j=0;j<n;j++){const a=e.a+j/n*TAU;ebul.push({x:e.x,y:e.y,vx:Math.cos(a)*190,vy:Math.sin(a)*190,l:6})}snd(90,.3,'sawtooth',.06)}
   e.cd2-=dt;if(e.cd2<=0){e.cd2=5;for(let j=0;j<3;j++){spawn('dasher');const n=ens[ens.length-1];n.x=e.x;n.y=e.y}}}
  e.vx+=dx*e.spd*4*dt;e.vy+=dy*e.spd*4*dt;const f=Math.pow(.02,dt);e.vx*=f;e.vy*=f;
  for(let j=i-1;j>=Math.max(0,i-6);j--){const o=ens[j],sx=e.x-o.x,sy=e.y-o.y,sd=Math.hypot(sx,sy)||1,mn=e.r+o.r;if(sd<mn){e.vx+=sx/sd*200*dt;e.vy+=sy/sd*200*dt;o.vx-=sx/sd*200*dt;o.vy-=sy/sd*200*dt}}
  e.x+=e.vx*dt;e.y+=e.vy*dt;
  if(ton&&segD(e.x,e.y,A.x,A.y,B.x,B.y)<e.r+7){e.hp-=75*up.tether*up.dmg*dt;e.byT=.5;e.hit=.05;if(R()<.5&&parts.length<700)parts.push({x:e.x,y:e.y,vx:rnd(-200,200),vy:rnd(-200,200),l:.25,ml:.25,col:'#ffffff',r:3})}
  for(const p of P)if(!p.down&&Math.hypot(p.x-e.x,p.y-e.y)<e.r+13){hurt(p,e.type=='boss'?30:e.type=='tank'?20:12);const a=Math.atan2(p.y-e.y,p.x-e.x);p.vx+=Math.cos(a)*420;p.vy+=Math.sin(a)*420}
  if(core&&Math.hypot(core.x-e.x,core.y-e.y)<e.r+40){core.hp-=(e.type=='tank'?22:10)*dt;shake=Math.max(shake,2);if(core.hp<=0){boom(core.x,core.y,'#ffffff',120,500);msg='REAKTOR ZERSTÖRT';msgT=3;over();return}}
  if(e.hp<=0){ens.splice(i,1);kill(e)}}
 // bullets
 for(let i=bul.length;i--;){const b=bul[i];b.l-=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;let dead=b.l<=0;
  if(!dead)for(const e of ens){if(b.last!=e&&Math.hypot(e.x-b.x,e.y-b.y)<e.r+5){e.hp-=b.d;e.hit=.07;e.vx+=b.vx*.03;e.vy+=b.vy*.03;boom(b.x,b.y,b.col,3,90);if(b.pc-->0)b.last=e;else dead=true;break}}
  if(dead)bul.splice(i,1)}
 for(let i=ebul.length;i--;){const b=ebul[i];b.l-=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;let dead=b.l<=0;
  if(ton&&segD(b.x,b.y,A.x,A.y,B.x,B.y)<8){dead=true;boom(b.x,b.y,'#ffffff',4,80)}
  for(const p of P)if(!dead&&!p.down&&Math.hypot(p.x-b.x,p.y-b.y)<14){hurt(p,10);dead=true}
  if(dead)ebul.splice(i,1)}
 // gems & crystals
 for(let i=gems.length;i--;){const m=gems[i];m.l-=dt;m.vx*=.94;m.vy*=.94;let got=m.l<=0&&(m.l=-1,true);
  for(const p of P)if(!p.down){const d=Math.hypot(p.x-m.x,p.y-m.y);if(d<130*up.magnet){m.vx+=(p.x-m.x)/d*1500*dt;m.vy+=(p.y-m.y)/d*1500*dt}if(d<18&&m.l>0){got=true;score+=5*combo;comboT=3.5;p.hp=Math.min(up.hpmax,p.hp+.6);snd(900+combo*40,.04,'sine',.025)}}
  m.x+=m.vx*dt;m.y+=m.vy*dt;if(got)gems.splice(i,1)}
 for(let i=crys.length;i--;){const c=crys[i];c.a+=dt*2;for(const p of P)if(!p.down&&Math.hypot(p.x-c.x,p.y-c.y)<30){crys.splice(i,1);mis.prog++;score+=50*combo;boom(c.x,c.y,'#7dffea',26,260);snd(660,.25,'triangle',.06,600);break}}
 // mission done
 if(mis.prog>=mis.need){st='upgrade';stT=0;sel=1;score+=250*lvl;const pool=UPS.slice();cards=[];for(let i=0;i<3;i++)cards.push(pool.splice(R()*pool.length|0,1)[0]);
  ens.forEach(e=>boom(e.x,e.y,e.col,12));ens=[];ebul=[];flash=.5;snd(440,.5,'triangle',.07,440);setTimeout(()=>snd(660,.5,'triangle',.07,440),150)}}

// ---------- draw
const GS={};function gl(x,y,r,col,a=1){let s=GS[col];if(!s){s=document.createElement('canvas');s.width=s.height=64;const q=s.getContext('2d'),gr=q.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'#fff');gr.addColorStop(.2,col);gr.addColorStop(1,'rgba(0,0,0,0)');q.fillStyle=gr;q.globalAlpha=.9;q.fillRect(0,0,64,64);GS[col]=s}g.globalAlpha=a;g.drawImage(s,x-r,y-r,r*2,r*2);g.globalAlpha=1}
function poly(n,r,rot=0){g.beginPath();for(let i=0;i<n;i++){const a=rot+i/n*TAU;g[i?'lineTo':'moveTo'](Math.cos(a)*r,Math.sin(a)*r)}g.closePath()}
function bar(x,y,w,h,f,col,label){g.fillStyle='rgba(255,255,255,.08)';g.fillRect(x,y,w,h);g.fillStyle=col;g.fillRect(x,y,w*clamp(f,0,1),h);g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=1;g.strokeRect(x+.5,y+.5,w,h);if(label){g.fillStyle='#fff';g.font='600 12px system-ui';g.textAlign='left';g.fillText(label,x,y-5)}}
function draw(){g.setTransform(DPR,0,0,DPR,0,0);const mx=(P[0].x+P[1].x)/2-W/2,my=(P[0].y+P[1].y)/2-H/2;
 const sx=(R()-.5)*shake,sy=(R()-.5)*shake;g.translate(sx,sy);
 g.globalCompositeOperation='source-over';g.drawImage(bg,-80-mx*.04,-80-my*.04);
 // stars
 g.fillStyle='#fff';for(const s of stars){s.y+=s.z*.25;if(s.y>H)s.y=0;const a=.3+.5*Math.abs(Math.sin(T*2*s.z+s.tw));g.globalAlpha=a*s.z;const x=((s.x-mx*s.z*.15)%W+W)%W,y=((s.y-my*s.z*.15)%H+H)%H;g.fillRect(x,y,s.z*2,s.z*2)}g.globalAlpha=1;
 // perspective grid
 g.globalCompositeOperation='lighter';g.strokeStyle=`hsla(${hue},100%,60%,.07)`;g.lineWidth=1;g.beginPath();const gs=64,ox=((-mx*.3)%gs+gs)%gs,oy=((-my*.3+T*14)%gs+gs)%gs;
 for(let x=ox;x<W;x+=gs){g.moveTo(x,0);g.lineTo(x,H)}for(let y=oy;y<H;y+=gs){g.moveTo(0,y);g.lineTo(W,y)}g.stroke();
 // core
